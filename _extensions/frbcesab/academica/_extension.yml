title: "Academica"
author: Nicolas Casajus
version: 1.0.0
quarto-required: ">=1.2.0"

contributes:
  formats:
    revealjs:

      theme: [default, scss/main.scss]
      syntax-highlighting: arrow

      logo: assets/default-logo.png
      favicon: assets/default-favicon.png

      date: today
      date-format: "MMMM YYYY"

      filters:
        - filters/favicon.lua

      template-partials:
        - _partials/title-slide.html

      assets:
        orcid: assets/orcid.svg

      include-in-header:
        - text: |
            <link
              rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
            />
      
      link-external-newwindow: true

      hash: true
      hash-type: title
      fragment-in-url: false
      history: false

      slide-level: 2

      slide-number: true
      show-slide-number: all
      progress: false

      controls: auto
      chalkboard: false

      incremental: false
      auto-stretch: false
      scrollable: true
